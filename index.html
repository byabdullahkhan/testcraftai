    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatic loader for GitHub Pages "Deploy from a branch" when set to / (root)
      (function() {
        var hasBuiltBundle = document.querySelector('script[src*="assets/index.js"]');
        if (window.location.hostname.includes('github.io') && !hasBuiltBundle) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './docs/assets/index.css?v=9';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './docs/assets/index.js?v=9';
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
