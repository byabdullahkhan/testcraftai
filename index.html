<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TestCraft AI - Smart Test Creator & AI Evaluator</title>
    <meta name="description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <meta property="og:title" content="TestCraft AI - Smart Test Creator & AI Evaluator" />
    <meta property="og:description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <meta property="og:image" content="./logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback detector if GitHub Pages is configured to serve root (/) instead of /docs or GitHub Actions
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && window.location.hostname.includes('github.io')) {
            var currentPath = window.location.pathname;
            if (!currentPath.includes('/docs')) {
              var targetDocs = currentPath.replace(/\/index\.html$/, '').replace(/\/+$/, '') + '/docs/';
              var search = window.location.search || '';
              var sep = search ? '&' : '?';
              var redirectUrl = targetDocs + search + sep + '_v=8' + (window.location.hash || '');
              fetch(targetDocs + 'index.html', { method: 'HEAD', cache: 'no-store' })
                .then(function(res) {
                  if (res.ok) {
                    window.location.replace(redirectUrl);
                  }
                })
                .catch(function() {});
            }
          }
        }, 600);
      });
    </script>
  </body>
</html>
