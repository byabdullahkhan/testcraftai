<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TestCraft AI - Smart Test Creator & AI Evaluator</title>
    <meta name="description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta property="og:title" content="TestCraft AI - Smart Test Creator & AI Evaluator" />
    <meta property="og:description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback detector for GitHub Pages
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && window.location.hostname.includes('github.io')) {
            // Check if /docs/ exists and redirect automatically
            var currentPath = window.location.pathname;
            if (!currentPath.includes('/docs')) {
              var targetDocs = currentPath.replace(/\/+$/, '') + '/docs/';
              fetch(targetDocs + 'index.html', { method: 'HEAD' })
                .then(function(res) {
                  if (res.ok) {
                    window.location.replace(targetDocs);
                  } else {
                    showNotice();
                  }
                })
                .catch(showNotice);
            } else {
              showNotice();
            }
          }
        }, 1200);

        function showNotice() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            root.innerHTML = '<div style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 60px auto; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; color: #1e293b;"><div style="display:inline-block; padding: 6px 12px; background: #eff6ff; color: #2563eb; border-radius: 6px; font-weight: 700; font-size: 13px; margin-bottom: 16px;">GitHub Pages Setup</div><h2 style="font-size: 20px; font-weight: 800; margin: 0 0 10px; color: #0f172a;">Almost Live! Quick 30-Second Fix</h2><p style="font-size: 14px; line-height: 1.6; color: #64748b; margin-bottom: 16px;">GitHub is currently serving the unbuilt code. Choose either option below to see your site live:</p><div style="background: #f8fafc; padding: 14px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0;"><strong style="color: #0f172a; font-size: 14px;">Method 1 (Recommended): Use GitHub Actions</strong><ol style="margin: 6px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.6; color: #334155;"><li>Go to your GitHub repo &rarr; <b>Settings</b> &rarr; <b>Pages</b></li><li>Change <b>Source</b> from <i>"Deploy from a branch"</i> to <b>"GitHub Actions"</b></li></ol></div><div style="background: #f8fafc; padding: 14px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e2e8f0;"><strong style="color: #0f172a; font-size: 14px;">Method 2: Use the built /docs folder</strong><ol style="margin: 6px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.6; color: #334155;"><li>In <b>Settings</b> &rarr; <b>Pages</b>, under Branch, choose <b>main</b> and folder <b>/docs</b></li><li>Click <b>Save</b></li></ol></div></div>';
          }
        }
      });
    </script>
  </body>
</html>
