<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TestCraft AI - Smart Test Creator & AI Evaluator</title>
    <meta name="description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <meta property="og:title" content="TestCraft AI - Smart Test Creator & AI Evaluator" />
    <meta property="og:description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <meta property="og:image" content="./logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var h = window.location.hostname;
        var isDevServer =
          h === 'localhost' ||
          h === '127.0.0.1' ||
          h.indexOf('run.app') !== -1 ||
          h.indexOf('googleusercontent.com') !== -1;
        var hasBuiltScript = document.querySelector('script[src*="assets/index"]');
        if (!isDevServer && !hasBuiltScript) {
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './assets/index.css?v=10';
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.src = './assets/index.js?v=10';
          js.onerror = function() {
            var css2 = document.createElement('link');
            css2.rel = 'stylesheet';
            css2.href = './docs/assets/index.css?v=10';
            document.head.appendChild(css2);

            var js2 = document.createElement('script');
            js2.type = 'module';
            js2.src = './docs/assets/index.js?v=10';
            document.body.appendChild(js2);
          };
          document.body.appendChild(js);
        }
      })();
    </script>
  </body>
</html>
