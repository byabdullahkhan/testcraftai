    <script>
      if (window.location.hostname.includes('github.io') && window.location.pathname.includes('/test/')) {
        var parts = window.location.pathname.split('/test/');
        var base = (parts[0] || '').replace(/\/+$/, '');
        var slug = parts[1] ? parts[1].split('/')[0] : '';
        if (slug) {
          window.location.replace(base + '/?test=' + encodeURIComponent(slug));
        }
      }
      // Render crisp PNG favicon onto canvas so Chrome tab bar always shows the TestCraft AI logo
      window.addEventListener('DOMContentLoaded', function() {
        try {
          var favLink = document.getElementById('dynamic-favicon');
          if (!favLink) return;
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            var ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.drawImage(img, 0, 0, 64, 64);
              var pngUrl = canvas.toDataURL('image/png');
              favLink.type = 'image/png';
              favLink.href = pngUrl;
            }
          };
          img.src = favLink.href;
        } catch (e) {}
      });
    </script>
