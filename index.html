<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TestCraft AI - Smart Test Creator & AI Evaluator</title>
    <meta name="description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <meta property="og:title" content="TestCraft AI - Smart Test Creator & AI Evaluator" />
    <meta property="og:description" content="Create customizable tests with MCQs, True/False, and AI-evaluated theory questions, generate shareable links, and track student performance." />
    <meta property="og:image" content="./logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      if (window.location.hostname.includes('github.io') && window.location.pathname.includes('/test/')) {
        var parts = window.location.pathname.split('/test/');
        var base = (parts[0] || '').replace(/\/+$/, '');
        var slug = parts[1] ? parts[1].split('/')[0] : '';
        if (slug) {
          window.location.replace(base + '/?test=' + encodeURIComponent(slug));
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
