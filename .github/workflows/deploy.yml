name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare clean frontend package.json for public npm
        run: |
          rm -f package-lock.json bun.lock
          node -e '
            const fs = require("fs");
            const cleanPkg = {
              name: "testcraft-ai",
              private: true,
              version: "1.0.0",
              type: "module",
              scripts: {
                build: "vite build"
              },
              dependencies: {
                "react": "^19.0.0",
                "react-dom": "^19.0.0",
                "lucide-react": "latest",
                "motion": "latest",
                "firebase": "^12.11.0"
              },
              devDependencies: {
                "@tailwindcss/vite": "^4.0.0",
                "@types/node": "^22.0.0",
                "@types/react": "^19.0.0",
                "@types/react-dom": "^19.0.0",
                "@vitejs/plugin-react": "^4.3.4",
                "tailwindcss": "^4.0.0",
                "typescript": "^5.6.0",
                "vite": "^6.0.0"
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(cleanPkg, null, 2));
          '

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build static frontend
        run: |
          npx vite build --base=./
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          ls -la dist dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
